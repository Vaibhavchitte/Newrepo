name: Deploy .NET Project to Plesk (Blue-Green)

on:
  push:
    branches:
      - main  # Trigger on push to the main branch

env:
  DOTNET_VERSION: '8.0'  # Adjust .NET version
  PUBLISH_DIR: './publish'  # Folder for published app
  PLESK_URL: 'https://your-plesk-server.com'
  PLESK_SITE_ID: 'your-site-id'  # Your Plesk site ID
  REMOTE_DIR_BLUE: '/httpdocs/app/'  # Current live version
  REMOTE_DIR_GREEN: '/httpdocs/app_v2/'  # New version
  BACKUP_DIR: '/httpdocs/app_old/'  # Backup old version

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache NuGet Packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build and Publish
        run: dotnet publish -c Release -o ${{ env.PUBLISH_DIR }}

      - name: Identify Changed Files (Excluding web.config & images/)
        id: changed_files
        run: |
          git diff --name-only HEAD^ HEAD | grep -E '\.(dll|cshtml|json)$' > changed_files.txt || echo "No changes detected"
          echo "CHANGED_FILES=$(cat changed_files.txt)" >> $GITHUB_ENV

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: env.CHANGED_FILES != ''  # Skip if no changes detected
    steps:
      - name: Backup Current Live Version
        run: |
          curl -X POST "${{ env.PLESK_URL }}/api/v2/sites/${{ env.PLESK_SITE_ID }}/files/move" \
               -H "Authorization: Bearer ${{ secrets.PLESK_API_TOKEN }}" \
               -H "Content-Type: application/json" \
               --data '{"source": "'${{ env.REMOTE_DIR_BLUE }}'", "destination": "'${{ env.BACKUP_DIR }}'"}'

      - name: Upload Changed Files to Green Directory
        run: |
          while IFS= read -r file; do
            curl -X POST "${{ env.PLESK_URL }}/api/v2/sites/${{ env.PLESK_SITE_ID }}/files/upload" \
                 -H "Authorization: Bearer ${{ secrets.PLESK_API_TOKEN }}" \
                 -H "Content-Type: multipart/form-data" \
                 -F "file=@${{ env.PUBLISH_DIR }}/$file"
          done < changed_files.txt

      - name: Preserve Important Files (web.config & images/)
        run: |
          curl -X POST "${{ env.PLESK_URL }}/api/v2/sites/${{ env.PLESK_SITE_ID }}/files/copy" \
               -H "Authorization: Bearer ${{ secrets.PLESK_API_TOKEN }}" \
               --data '{"source": "'${{ env.REMOTE_DIR_BLUE }}/images'", "destination": "'${{ env.REMOTE_DIR_GREEN }}/images'"}'

          curl -X POST "${{ env.PLESK_URL }}/api/v2/sites/${{ env.PLESK_SITE_ID }}/files/copy" \
               -H "Authorization: Bearer ${{ secrets.PLESK_API_TOKEN }}" \
               --data '{"source": "'${{ env.REMOTE_DIR_BLUE }}/web.config'", "destination": "'${{ env.REMOTE_DIR_GREEN }}/web.config'"}'

      - name: Switch Traffic to New Version (Green → Blue)
        run: |
          curl -X POST "${{ env.PLESK_URL }}/api/v2/sites/${{ env.PLESK_SITE_ID }}/files/move" \
               -H "Authorization: Bearer ${{ secrets.PLESK_API_TOKEN }}" \
               --data '{"source": "'${{ env.REMOTE_DIR_GREEN }}'", "destination": "'${{ env.REMOTE_DIR_BLUE }}'"}'

      - name: Restart Website
        run: |
          curl -X POST "${{ env.PLESK_URL }}/api/v2/sites/${{ env.PLESK_SITE_ID }}/restart" \
               -H "Authorization: Bearer ${{ secrets.PLESK_API_TOKEN }}"
